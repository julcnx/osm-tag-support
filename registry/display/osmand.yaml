spec_status: draft_partial
coverage_scope: OsmAnd default rendering style (default.render.xml). Behavior for topo.render.xml and Touring-view are similar for the tracked tags; differences are noted.
notes:
  - OsmAnd rendering has two distinct contexts for tag-based visual effects: map tile rendering (visible on the map at all times or behind a toggle) and route analysis panel (shown in the post-navigation segment detail view). These are separately documented below.
  - Surface and sac_scale affect both contexts. Smoothness is route-analysis only. tracktype affects map tile rendering and route analysis independently.
  - laterite is absent from the surface rendering list. Ways tagged surface=laterite fall through to the generic unstyled appearance (same color as any untagged road of that highway class).
  - All rendering properties (showSurfaces, alpineHiking, etc.) are per-profile user settings; the same physical way is rendered differently depending on the active app mode.
