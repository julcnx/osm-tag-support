        unknown_value_behavior: fallback_default
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: partial

      - tag_key: smoothness
        support_level: direct
        effect_types: [color, display_label]
        value_rules:
          - tag_value: excellent
            effect_kind: segment_color
            effect_value: "#00d8ff (cyan)"
          - tag_value: good
            effect_kind: segment_color
            effect_value: "#7debff (light cyan)"
          - tag_value: intermediate
            effect_kind: segment_color
            effect_value: "#b1f3ff (very light cyan)"
          - tag_value: bad
            effect_kind: segment_color
            effect_value: "#febcbc (light red)"
          - tag_value: very_bad
            effect_kind: segment_color
            effect_value: "#fea9a9 (medium red)"
          - tag_value: horrible
            effect_kind: segment_color
            effect_value: "#ff7f7f (salmon)"
          - tag_value: very_horrible
            effect_kind: segment_color
            effect_value: "#fe5050 (bright red)"
          - tag_value: impassable
            effect_kind: segment_color
            effect_value: "#ff1111 (vivid red)"
        special_handling:
          - very_good is absent from the routeInfo_smoothness list (line 2147-2156). Segments with smoothness=very_good show the undefined color in route analysis.
          - These are fixed hex constants defined at lines 2138-2145, not theme-dependent. They are the same in day and night mode.
          - Smoothness coloring only appears in the route analysis panel and segment detail view; it has NO effect on the main map tiles.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: partial

