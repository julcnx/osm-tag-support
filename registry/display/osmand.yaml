        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: full

      - tag_key: sac_scale
        support_level: user_defined_only
        effect_types: []
        value_rules: []
        special_handling:
          - sac_scale has no routeInfo_sac_scale attribute in default.render.xml. It does not appear in the route analysis panel color coding. Its only visual effect is the map tile overlay (documented in the map_surface profile above).
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: none

      - tag_key: mtb:scale
        support_level: user_defined_only
        effect_types: []
        value_rules: []
        special_handling:
          - Not present in any routeInfo_* attribute. No effect in route analysis.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: none

