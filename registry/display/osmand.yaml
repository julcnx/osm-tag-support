      - tag_key: surface
        support_level: direct
        effect_types: [color]
        value_rules:
          - tag_value: asphalt
            effect_kind: color_overlay
            effect_value: surfaceAsphaltColor (light grey, paved indicator)
            conditions: requires showSurfaces=true
          - tag_value: paved
            effect_kind: color_overlay
            effect_value: surfacePavedColor
            conditions: requires showSurfaces=true
          - tag_value: chipseal
            effect_kind: color_overlay
            effect_value: surfacePavedColor (same as paved)
            conditions: requires showSurfaces=true
          - tag_value: concrete
            effect_kind: color_overlay
            effect_value: surfaceConcreteColor
            conditions: requires showSurfaces=true
          - tag_value: paving_stones
            effect_kind: color_overlay
            effect_value: surfacePavingStonesColor
            conditions: requires showSurfaces=true
          - tag_value: sett
            effect_kind: color_overlay
            effect_value: surfaceSettColor
            conditions: requires showSurfaces=true
          - tag_value: cobblestone
            effect_kind: color_overlay
            effect_value: surfaceCobblestoneColor
            conditions: requires showSurfaces=true
          - tag_value: grass_paver
            effect_kind: color_overlay
            effect_value: surfaceGrassPaverColor
            conditions: requires showSurfaces=true
          - tag_value: pebblestone
            effect_kind: color_overlay
            effect_value: surfacePebblestoneColor
            conditions: requires showSurfaces=true
          - tag_value: stone
            effect_kind: color_overlay
            effect_value: surfaceStoneColor
            conditions: requires showSurfaces=true
          - tag_value: metal
            effect_kind: color_overlay
            effect_value: surfaceMetalColor
            conditions: requires showSurfaces=true
          - tag_value: wood
            effect_kind: color_overlay
            effect_value: surfaceWoodColor
            conditions: requires showSurfaces=true
          - tag_value: unpaved
            effect_kind: color_overlay
            effect_value: surfaceUnpavedColor (brown, unpaved indicator)
            conditions: requires showSurfaces=true
          - tag_value: gravel
            effect_kind: color_overlay
            effect_value: surfaceGravelColor
            conditions: requires showSurfaces=true
          - tag_value: fine_gravel
            effect_kind: color_overlay
            effect_value: surfaceFineGravelColor
            conditions: requires showSurfaces=true
          - tag_value: compacted
            effect_kind: color_overlay
            effect_value: surfaceCompactedColor
            conditions: requires showSurfaces=true
          - tag_value: ground
            effect_kind: color_overlay
            effect_value: surfaceGroundColor
            conditions: requires showSurfaces=true
          - tag_value: dirt
            effect_kind: color_overlay
            effect_value: surfaceDirtColor
            conditions: requires showSurfaces=true
          - tag_value: mud
            effect_kind: color_overlay
            effect_value: surfaceMudColor
            conditions: requires showSurfaces=true
          - tag_value: grass
            effect_kind: color_overlay
            effect_value: surfaceGrassColor
            conditions: requires showSurfaces=true
          - tag_value: sand
            effect_kind: color_overlay
            effect_value: surfaceSandColor
            conditions: requires showSurfaces=true
          - tag_value: salt
            effect_kind: color_overlay
            effect_value: surfaceSaltColor
            conditions: requires showSurfaces=true
          - tag_value: snow
            effect_kind: color_overlay
            effect_value: surfaceSnowColor
            conditions: requires showSurfaces=true
          - tag_value: ice
            effect_kind: color_overlay
            effect_value: surfaceIceColor
            conditions: requires showSurfaces=true
          # NOT in the rendering list: no color overlay applied
          - tag_value: laterite
            effect_kind: color_overlay
            effect_value: none (NOT in routeInfo_surface list; falls through to unstyled)
            conditions: even with showSurfaces=true, laterite is invisible in the overlay
        special_handling:
          - When showSurfaces=true, an extra colored band is drawn over the road/track/path casing using the color defined per surface value.
          - The color attribute names (surfaceAsphaltColor etc.) are theme-dependent rendering attributes, not fixed hex values. Colors differ between day and night modes.
          - laterite is absent from the case list at line 2106-2133. Adding it requires a one-line addition to routeInfo_surface in default.render.xml.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: partial

      - tag_key: tracktype
        support_level: direct
        effect_types: [line_style]
        value_rules:
          - tag_value: grade1
            effect_kind: line_dash
            effect_value: solid (pathEffect="")
          - tag_value: grade2
            effect_kind: line_dash
            effect_value: long dash (pathEffect="10_3", ~77% duty cycle)
          - tag_value: grade3
            effect_kind: line_dash
            effect_value: medium dash (pathEffect="5_3", ~63% duty cycle)
          - tag_value: grade4
            effect_kind: line_dash
            effect_value: short dash (pathEffect="3_3", ~50% duty cycle)
          - tag_value: grade5
            effect_kind: line_dash
            effect_value: very short dash (pathEffect="2_3", ~40% duty cycle)
        special_handling:
          - tracktype dash patterns apply to highway=track ways always (not behind a toggle). The comment at line 10690 of default.render.xml explicitly documents the duty cycles.
          - At zoom <= 13 all dash patterns are overridden to solid regardless of tracktype (pathEffect="" applied).
        unknown_value_behavior: fallback_default
        missing_tag_behavior: profile_default
        hard_exclusions: []
        value_coverage: full

      - tag_key: sac_scale
        support_level: direct
        effect_types: [color, line_style]
        value_rules:
          - tag_value: hiking
            effect_kind: color_overlay
            effect_value: default path color (no change; hiking is the baseline)
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
          - tag_value: mountain_hiking
            effect_kind: color_overlay
            effect_value: sacScaleColorT2 (#e23cad, magenta), solid line (pathEffect="")
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
          - tag_value: demanding_mountain_hiking
            effect_kind: color_overlay
            effect_value: sacScaleColorT3 (#e23cad, magenta), dashed (pathEffect="10_3")
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
          - tag_value: alpine_hiking
            effect_kind: color_overlay
            effect_value: sacScaleColorT4 (#6000ff, purple), solid
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
          - tag_value: demanding_alpine_hiking
            effect_kind: color_overlay
            effect_value: sacScaleColorT5 (#6000ff, purple), dashed (pathEffect="10_3")
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
          - tag_value: difficult_alpine_hiking
            effect_kind: color_overlay
            effect_value: sacScaleColorT6 (#6000ff, purple), very dashed (pathEffect="3_3")
            conditions: requires alpineHiking=true + alpineHikingScaleScheme=sacScale
        special_handling:
          - Both rendering properties must be active: alpineHiking=true (enables the alpine overlay) AND alpineHikingScaleScheme=sacScale (selects SAC coloring vs CAI or other schemes).
          - The comment at line 1325 notes that the color convention deviates from the Swiss alpine hiking map convention the SAC scale originates from. T1 (hiking) is black; T2-T3 are magenta; T4-T6 are purple.
          - When showSurfaceGrade=true is also active, the stroke width on paths widens to accommodate the colored overlay alongside the sac_scale band.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: partial

      - tag_key: smoothness
        support_level: user_defined_only
        effect_types: []
        value_rules: []
        special_handling:
          - Smoothness has NO map tile rendering effect. The routeInfo_smoothness attribute (lines 2147-2156) is used exclusively in the route analysis panel after navigation, not as a visible overlay on the map.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: none

      - tag_key: mtb:scale
        support_level: user_defined_only
        effect_types: []
        value_rules: []
        special_handling:
          - mtb:scale is not present in any rendering rule in default.render.xml or topo.render.xml. No visual effect on map tiles.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: none

