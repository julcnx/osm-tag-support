profiles:
  - profile_id: map_surface
    notes:
      - Covers rendering effects on map tiles (what the mapper sees without opening a route). Surface overlay requires showSurfaces=true. tracktype dash patterns are always-on for highway=track. sac_scale coloring requires alpineHiking=true + alpineHikingScaleScheme=sacScale.
