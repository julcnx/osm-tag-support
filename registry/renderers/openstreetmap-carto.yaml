engine_id: openstreetmap-carto
capability_id: style
engine_meta:
  website: https://www.openstreetmap.org
  repository: https://github.com/gravitystorm/openstreetmap-carto
  issues: https://github.com/gravitystorm/openstreetmap-carto/issues
spec_status: draft_partial
coverage_scope: The standard OSM tile style rendered at openstreetmap.org. Tag effects are global; there is one style with no user-selectable profiles.
notes:
  - OSM Carto is a general-purpose reference map, not an outdoor or routing style. Its primary concern is cartographic clarity at a range of zoom levels.
  - Tag support for surface, tracktype, and sac_scale is limited to what is visible on the rendered tiles; no semantic information is passed to map consumers.
  - Surface detection uses a hard-coded list of values. Values not in the list silently fall through to default (paved) rendering. laterite is not in the list and renders as paved-looking by default.
  - Smoothness and mtb:scale have no rendering effect in the current style.
