profile_id: default
mode: general
tags:
  - tag_key: surface
    support_level: direct
    effect_types: [line_style]
    value_rules:
      # explicitly classified as unpaved: dashed road casing applied
      - tag_value: unpaved
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: compacted
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: dirt
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: earth
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: fine_gravel
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: grass
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: grass_paver
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: gravel
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: gravel_dirt
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: ground
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: ice
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: mud
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: pebblestone
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: rock
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: salt
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: sand
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: snow
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: woodchips
        effect_kind: line_style
        effect_value: dashed_casing
      # explicitly classified as paved: solid casing (default)
      - tag_value: asphalt
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: concrete
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: concrete:lanes
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: concrete:plates
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: paving_stones
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: sett
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: cobblestone
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: cobblestone:flattened
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: metal
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: wood
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: paved
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: bricks
        effect_kind: line_style
        effect_value: solid_casing
      # NOT in the explicit list: falls through to solid_casing (treated as paved)
      - tag_value: laterite
        effect_kind: line_style
        effect_value: solid_casing (NOT in unpaved list; renders as paved despite being unpaved)
      - tag_value: clay
        effect_kind: line_style
        effect_value: solid_casing (NOT in unpaved list)
    special_handling:
      - The unpaved/paved decision is binary. There is no gradient or additional visual cue beyond the dashed casing to indicate surface quality.
      - The surface list is checked in the CartoCSS selector via a regexp or array match. Any value not matching is treated as paved.
      - laterite is an unpaved surface common in tropical and West African regions. Its omission from the unpaved list causes it to render with solid casing, indistinguishable from asphalt. See issue #3936.
      - The dashed casing appears from approximately zoom 12 upward. At lower zooms, surface has no visual effect.
    unknown_value_behavior: fallback_default
    missing_tag_behavior: inferred_from_road_class
    hard_exclusions: []
    value_coverage: partial

  - tag_key: tracktype
    support_level: direct
    effect_types: [line_style]
    value_rules:
      - tag_value: grade1
        effect_kind: line_style
        effect_value: solid track line
      - tag_value: grade2
        effect_kind: line_style
        effect_value: long dash (e.g. 6px on / 3px off)
      - tag_value: grade3
        effect_kind: line_style
        effect_value: medium dash (e.g. 4px on / 4px off)
      - tag_value: grade4
        effect_kind: line_style
        effect_value: short dash (e.g. 3px on / 4px off)
      - tag_value: grade5
        effect_kind: line_style
        effect_value: very short dash (near-dotted)
    special_handling:
      - Applies only to highway=track ways. Other highway types are not affected by tracktype.
      - tracktype takes precedence over surface for track line styling. If both are present, the tracktype dash pattern is used.
    unknown_value_behavior: fallback_default
    missing_tag_behavior: profile_default
    hard_exclusions: []
    value_coverage: full

  - tag_key: smoothness
    support_level: user_defined_only
    effect_types: []
    value_rules: []
    special_handling:
      - Not used in any CartoCSS selector. No visual differentiation based on smoothness value.
    unknown_value_behavior: ignore
    missing_tag_behavior: none
    hard_exclusions: []
    value_coverage: none

  - tag_key: sac_scale
    support_level: user_defined_only
    effect_types: []
    value_rules: []
    special_handling:
      - Not used in the current openstreetmap-carto style. Paths are rendered uniformly regardless of sac_scale value. Dedicated outdoor map styles (e.g. OpenTopoMap, Waymarked Trails) do use sac_scale for path coloring.
    unknown_value_behavior: ignore
    missing_tag_behavior: none
    hard_exclusions: []
    value_coverage: none

  - tag_key: mtb:scale
    support_level: user_defined_only
    effect_types: []
    value_rules: []
    special_handling:
      - Not used in the current openstreetmap-carto style.
    unknown_value_behavior: ignore
    missing_tag_behavior: none
    hard_exclusions: []
    value_coverage: none

