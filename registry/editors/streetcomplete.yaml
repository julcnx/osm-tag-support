            effect_kind: image_option
            effect_value: illustrated button
          - tag_value: paved
            effect_kind: image_option
            effect_value: illustrated button (catch-all for unlisted paved)
        special_handling:
          - Quest fires on highway=* ways missing surface=*, filtered by element eligibility rules (e.g. minimum road class, minimum length).
          - The answer buttons are shown in a scrollable grid with illustrative icons. A "I don't know" option is always present.
          - Selecting "paved" or "unpaved" as catch-all values adds the generic tag; selecting a specific value like "asphalt" adds that directly.
          - StreetComplete does not allow the mapper to type an arbitrary value; the answer set is fixed per quest.
        unknown_value_behavior: ignore
        missing_tag_behavior: prompt_user
        hard_exclusions: []
        value_coverage: partial
