engine_id: streetcomplete
capability_id: preset_ui
engine_meta:
  website: https://streetcomplete.app
  repository: https://github.com/streetcomplete/StreetComplete
  issues: https://github.com/streetcomplete/StreetComplete/issues
spec_status: draft_partial
coverage_scope: Quest-based mobile editor. Only tags with a dedicated quest are documented; tags without a quest are inaccessible through the primary StreetComplete UI.
notes:
  - StreetComplete presents one tag at a time as a "quest" (a map pin the mapper taps to answer a specific question). Each quest covers exactly one tag or a closely related group.
  - Quests are filtered by the OSM element type and existing tags; a road-surface quest only fires on ways that lack a surface tag and meet the highway class criteria.
  - Answers are presented as illustrated buttons with short text labels; free-text entry is not the primary path. Mappers cannot see or edit raw tags during a quest.
  - As of 2024, StreetComplete includes a basic tag editor ("Edit tags") accessible via the element detail panel, but this is not the primary editing flow.
  - Tags not covered by any quest (tracktype, sac_scale, mtb:scale) are inaccessible through the normal quest workflow. They can only be set using the tag editor, which most StreetComplete users do not use.
  - Quest availability is platform-wide; all mappers see the same quests (modulo local country-specific visibility rules). There is no user-configurable "profile" in the routing sense.
