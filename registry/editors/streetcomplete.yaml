  - profile_id: AddSmoothness
    mode: general
    tags:
      - tag_key: smoothness
        support_level: direct
        effect_types: [preset_field, autocomplete]
        value_rules:
          - tag_value: excellent
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon showing minimum required vehicle type
          - tag_value: good
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: intermediate
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: bad
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: very_bad
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: horrible
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: very_horrible
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
          - tag_value: impassable
            effect_kind: image_option
            effect_value: illustrated button with vehicle icon
        special_handling:
          - Introduced in StreetComplete v50 (2023). Quest fires on paved ways missing smoothness=*.
          - StreetComplete uses the "minimum vehicle that can traverse" framing from the OSM wiki, showing the smallest vehicle type (racing bike, touring bike, city bike, SUV, tractor, etc.) as the answer metaphor. The mapper picks the smallest vehicle that could still use the way.
          - very_good is omitted from the default answer set; excellent and good cover the top end.
          - The quest only fires on paved surfaces (asphalt, concrete, paving_stones, etc.) to keep the question meaningful. Unpaved ways with surface=dirt are not asked.
        unknown_value_behavior: ignore
        missing_tag_behavior: prompt_user
        hard_exclusions: []
        value_coverage: partial
      - tag_key: surface
        support_level: derived
        effect_types: [inferred_fallback]
        value_rules: []
        special_handling:
          - The AddSmoothness quest checks surface=* as a precondition. If surface is paved, the quest fires. Surface itself is not written by this quest.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
        value_coverage: none
    evidence:
      - file: https://github.com/streetcomplete/StreetComplete/blob/master/app/src/main/kotlin/de/westnordost/streetcomplete/quests/smoothness/AddSmoothness.kt
        line: 1
        summary: Quest definition for smoothness; includes eligibility filter (paved surface required), answer forms, and vehicle-metaphor framing.
        confidence: medium
    verified_on: 2026-06-08

