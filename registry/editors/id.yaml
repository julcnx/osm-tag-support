engine_id: id-tagging-schema
capability_id: preset_ui
engine_meta:
  website: https://wiki.openstreetmap.org/wiki/ID
  repository: https://github.com/openstreetmap/id-tagging-schema
  issues: https://github.com/openstreetmap/id-tagging-schema/issues
spec_status: draft_partial
coverage_scope: Web-based editor. Tag field support is defined in the id-tagging-schema package, which is shared by iD and other editors consuming the same field definitions.
notes:
  - iD separates field definitions (data/fields/) from preset definitions (data/presets/). A field can appear in multiple presets.
  - Fields can be of type combo (editable dropdown), typeCombo (infers type from context), radio, number, or text. Surface, smoothness, and tracktype use combo fields. sac_scale and mtb:scale use combo or typeCombo.
  - iD shows a "more fields" expander below the primary fields; less common tags like smoothness may appear there rather than at the top level depending on the preset.
  - Unknown values typed manually are accepted and saved without warning in most cases.
  - The separate @openstreetmap/id-tagging-schema npm package is used by iD, Rapid, and potentially other editors.
