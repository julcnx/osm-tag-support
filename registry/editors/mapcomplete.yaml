engine_id: mapcomplete
capability_id: preset_ui
engine_meta:
  website: https://mapcomplete.org
  repository: https://github.com/pietervdvn/MapComplete
  issues: https://github.com/pietervdvn/MapComplete/issues
spec_status: draft_partial
coverage_scope: Tag support is theme-dependent. Only themes covering outdoor paths and cycling infrastructure are documented here.
notes:
  - MapComplete is a thematic web editor. Each theme (called a "layer" at the technical level) defines exactly which tags are editable and with what UI widget.
  - Tag questions can be text, dropdown, radio, image-select, or mapped/derived types. The specific widget is defined per tag per theme.
  - Mappers only see the tags relevant to the active theme. Tags outside a theme's question set must be edited via the raw tag editor (accessible by clicking the pencil icon).
  - Theme files live in assets/layers/<name>/ as JSON. A theme can include multiple layers.
  - MapComplete supports crowdsourced review (TagRendering answers from multiple mappers), which affects how confidently a tag is displayed vs. prompted.
related_issues:
  - id: 1821
    title: "Add smoothness question to cyclostreets and bicycle_infrastructure layers"
    state: open
    url: https://github.com/pietervdvn/MapComplete/issues/1821
    tags: [smoothness]
    note: Smoothness is currently absent from the cycling-focused layers that already ask about surface. Adding it would make cycling layers more useful for routing consumers.
    checked_on: 2026-06-08
    last_reply_date: 2024-03-19

