  - profile_id: hiking-mountain
    mode: foot
    tags:
      - tag_key: surface
        support_level: profile_dependent
        effect_types: [priority_factor]
        precedence_order: [surface, tracktype]
        value_rules:
          - tag_value: paved
            effect_kind: penalty_factor
            effect_value: "0.0"
          - tag_value: asphalt
            effect_kind: penalty_factor
            effect_value: "0.0"
          - tag_value: concrete
