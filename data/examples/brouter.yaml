            effect_value: "0.1"
          - tag_value: gravel
            effect_kind: penalty_factor
            effect_value: "0.2"
          - tag_value: pebblestone
            effect_kind: penalty_factor
            effect_value: "0.2"
        special_handling:
          - Applied to tracks only. Wet condition amplifies tracktype-based penalties.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: inferred_from_other_tags
        hard_exclusions: []
      - tag_key: smoothness
        support_level: derived
        effect_types: [priority_factor]
        precedence_order: [tracktype, wetness_condition]
        value_rules:
          - tag_value: grade1_wet
            effect_kind: penalty_factor
            effect_value: "0.1"
          - tag_value: grade3_wet
            effect_kind: penalty_factor
            effect_value: "0.3"
          - tag_value: grade5_wet
            effect_kind: penalty_factor
            effect_value: "1.0"
        special_handling:
          - Smoothness tag not used directly; wet tracktype penalty acts as proxy.
          - Only active when iswet=1.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: []
      - tag_key: tracktype
        support_level: direct
        effect_types: [priority_factor]
        precedence_order: [tracktype, surface]
        value_rules:
          - tag_value: grade1
            effect_kind: penalty_factor
            effect_value: "0.1"
          - tag_value: grade2
            effect_kind: penalty_factor
            effect_value: "0.05"
          - tag_value: grade3
            effect_kind: penalty_factor
            effect_value: "0.0"
          - tag_value: grade4
            effect_kind: penalty_factor
            effect_value: "0.0"
          - tag_value: grade5
            effect_kind: penalty_factor
            effect_value: "0.0"
        special_handling:
          - Applied to tracks only. Grade1 is slightly penalized as paved tracks are less desirable for hiking.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: none
        hard_exclusions: []
      - tag_key: sac_scale
        support_level: direct
        effect_types: [priority_factor, access_block]
        precedence_order: [sac_scale, mtb:scale_fallback]
        value_rules:
          - tag_value: hiking
            effect_kind: penalty_factor
            effect_value: "0.0 (SAC=1)"
          - tag_value: mountain_hiking
            effect_kind: penalty_factor
            effect_value: "K2-based (SAC=2)"
          - tag_value: demanding_mountain_hiking
            effect_kind: penalty_factor
            effect_value: "K2-based (SAC=3)"
          - tag_value: alpine_hiking
            effect_kind: penalty_factor
            effect_value: "9000 at default limit (SAC=4)"
          - tag_value: demanding_alpine_hiking
            effect_kind: penalty_factor
            effect_value: "9000 (SAC=5)"
          - tag_value: difficult_alpine_hiking
            effect_kind: penalty_factor
            effect_value: "9000 (SAC=6)"
        special_handling:
          - SAC_scale_limit default 3; any SAC above limit gets access penalty 9000.
          - Below limit, penalty uses K1=0.05 / K2=0.6 multipliers relative to SAC_scale_preferred (default 1).
          - Falls back to mtb:scale if sac_scale absent.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: inferred_from_other_tags
        hard_exclusions: []
      - tag_key: mtb:scale
        support_level: derived
        effect_types: [priority_factor, access_block]
        precedence_order: [sac_scale, mtb:scale_fallback]
        value_rules:
          - tag_value: "0"
            effect_kind: penalty_factor
            effect_value: "SAC=1 equivalent"
          - tag_value: "1"
            effect_kind: penalty_factor
            effect_value: "SAC=1 equivalent"
          - tag_value: "2-"
            effect_kind: penalty_factor
            effect_value: "SAC=2 equivalent"
          - tag_value: "2"
            effect_kind: penalty_factor
            effect_value: "SAC=2 equivalent"
          - tag_value: "2+"
            effect_kind: penalty_factor
            effect_value: "SAC=2 equivalent"
          - tag_value: "3"
            effect_kind: penalty_factor
            effect_value: "SAC=3 equivalent"
          - tag_value: "4"
            effect_kind: penalty_factor
            effect_value: "SAC=4 equivalent"
          - tag_value: "5"
            effect_kind: penalty_factor
            effect_value: "SAC=5 equivalent"
          - tag_value: "6"
            effect_kind: penalty_factor
            effect_value: "SAC=5 equivalent"
        special_handling:
          - Used only as fallback when sac_scale is absent.
          - Mapped to SAC levels; same K1/K2 penalty and access limit logic applies.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: none
        hard_exclusions: []
    evidence:
