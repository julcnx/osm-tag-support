engine_id: brouter
capability_id: routing
engine_meta:
  website: https://brouter.de
  repository: https://github.com/abrensch/brouter
  issues: https://github.com/abrensch/brouter/issues
spec_status: draft_partial
coverage_scope: Partial for off-road relevant profiles trekking, gravel, mtb, and hiking-mountain.
notes:
  - Profile behavior differs strongly between trekking, gravel, mtb, and car profiles.
profiles:
  - profile_id: trekking
    mode: bicycle
    tags:
      - tag_key: surface
        support_level: profile_dependent
        effect_types: [priority_factor, route_preference]
        precedence_order:
          [explicit_smoothness, inferred_from_surface, inferred_from_tracktype]
        value_rules:
          - tag_value: paved
            effect_kind: paved_classifier
            effect_value: "ispaved=true"
          - tag_value: asphalt
            effect_kind: paved_classifier
            effect_value: "ispaved=true"
          - tag_value: concrete
            effect_kind: paved_classifier
            effect_value: "ispaved=true"
          - tag_value: paving_stones
            effect_kind: paved_classifier
            effect_value: "ispaved=true"
          - tag_value: sett
            effect_kind: paved_classifier
            effect_value: "ispaved=true"
          - tag_value: fine_gravel
            effect_kind: paved_classifier
            effect_value: "ambiguous (not ispaved, not isunpaved)"
          - tag_value: cobblestone
            effect_kind: paved_classifier
            effect_value: "ambiguous (not ispaved, not isunpaved)"
          - tag_value: unpaved
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: ground
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: grass
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: dirt
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: earth
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: mud
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: clay
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: sand
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: gravel
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: pebblestone
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: grass_paver
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: wood
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
          - tag_value: metal
            effect_kind: paved_classifier
            effect_value: "isunpaved=true"
        special_handling:
          - ispaved drives 1.1x cost on residential/service; isunpaved drives 1.5-1.6x.
          - Surface also used to estimate smoothness when smoothness tag is absent.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: inferred_from_other_tags
        hard_exclusions: []
      - tag_key: smoothness
        support_level: profile_dependent
        effect_types: [speed_factor, priority_factor, access_block]
        precedence_order: [smoothness, surface, tracktype, highway]
        value_rules:
          - tag_value: bad
            effect_kind: multiply_factor
            effect_value: "1.5 to 2.5"
          - tag_value: horrible
            effect_kind: multiply_factor
            effect_value: "8.0 to 9.8"
          - tag_value: impassable
            effect_kind: multiply_factor
            effect_value: "100 to 200"
        special_handling:
          - Wet-condition switches alter penalties.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: inferred_from_other_tags
        hard_exclusions: [impassable]
      - tag_key: tracktype
        support_level: profile_dependent
        effect_types: [priority_factor, route_preference]
        precedence_order: [tracktype, probablyGood, highway]
        value_rules:
          - tag_value: grade1
            effect_kind: multiply_factor
            effect_value: "1.0 to 1.3"
          - tag_value: grade3
            effect_kind: multiply_factor
            effect_value: "1.5 to 3.0"
          - tag_value: grade5
            effect_kind: multiply_factor
            effect_value: "3.0 to 5.0"
        special_handling:
          - Tracktype often drives penalties on track/path/footway classes.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: inferred_from_other_tags
        hard_exclusions: []
    evidence:
      - file: sources/brouter/misc/profiles2/trekking.brf
        line: 100
        summary: ispaved and isunpaved derived from surface and smoothness.
        confidence: high
      - file: sources/brouter/misc/profiles2/trekking.brf
        line: 329
        summary: tracktype-based penalties for track-like ways.
        confidence: high
    verified_on: 2026-06-07

