      - tag_value: snow
        effect_kind: line_style
        effect_value: dashed_casing
      - tag_value: ice
        effect_kind: line_style
        effect_value: dashed_casing
      # explicitly treated as paved: solid casing (default)
      - tag_value: asphalt
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: concrete
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: paving_stones
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: sett
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: cobblestone
        effect_kind: line_style
        effect_value: solid_casing
      - tag_value: paved
        effect_kind: line_style
        effect_value: solid_casing
      # NOT in the explicit unpaved list: renders as paved (gap)
      - tag_value: laterite
        effect_kind: line_style
        effect_value: solid_casing (NOT in unpaved list; same gap as openstreetmap-carto)
      - tag_value: clay
        effect_kind: line_style
        effect_value: solid_casing (NOT in unpaved list)
    special_handling:
      - The paved/unpaved classification is done in JavaScript (style.js or equivalent) using an array of known unpaved values. Not a CSS selector like OSM Carto, but the same structural gap applies.
      - laterite is a well-known unpaved surface in tropical regions and should logically be in the unpaved set. Adding it would require a one-line change to the unpaved array.
      - Value coverage here is approximate; the exact array in the Americana source may differ slightly from openstreetmap-carto's list.
    unknown_value_behavior: fallback_default
    missing_tag_behavior: inferred_from_road_class
    hard_exclusions: []
    value_coverage: partial

  - tag_key: tracktype
    support_level: direct
    effect_types: [line_style]
    value_rules:
      - tag_value: grade1
        effect_kind: line_style
        effect_value: solid track line
      - tag_value: grade2
        effect_kind: line_style
        effect_value: dashed line (lower quality track)
      - tag_value: grade3
        effect_kind: line_style
        effect_value: dashed line
      - tag_value: grade4
        effect_kind: line_style
        effect_value: dashed line (low quality)
      - tag_value: grade5
        effect_kind: line_style
        effect_value: dashed line (minimum quality)
    special_handling:
      - Americana uses tracktype to style highway=track ways. Grade1 is the firmest surface (solid line); lower grades use dashed patterns.
      - Exact dash specifications may differ from openstreetmap-carto; verify against the current style source.
    unknown_value_behavior: fallback_default
    missing_tag_behavior: profile_default
    hard_exclusions: []
    value_coverage: full

