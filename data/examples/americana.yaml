engine_id: openstreetmap-americana
capability_id: style
engine_meta:
  website: https://americanamap.org
  repository: https://github.com/osm-americana/openstreetmap-americana
  issues: https://github.com/osm-americana/openstreetmap-americana/issues
spec_status: draft_partial
coverage_scope: Community US-focused map style built on MapLibre GL JS and Protomaps tiles. Surface and tracktype rendering are documented here; other tracked tags are not yet styled.
notes:
  - Americana renders from Protomaps-format vector tiles (or compatible sources). Tag support depends on both what is in the tile data and what the MapLibre GL style rules check.
  - The style is community-maintained and evolves faster than OSM Carto. Behavior described here reflects the main branch as of 2026-06.
  - Americana's primary focus is the United States road network. Off-road tags (sac_scale, mtb:scale) are lower priority and not currently styled.
  - Surface rendering follows a paved/unpaved binary model similar to OSM Carto. The unpaved value set is defined in the JavaScript style code and is subject to the same laterite omission gap.
  - laterite is not in Americana's unpaved surface list. Ways tagged surface=laterite render with solid casing (indistinguishable from asphalt), the same gap as in openstreetmap-carto.
related_issues:
  - id: 216
    title: "Render tracks, paths, trails"
    state: open
    url: https://github.com/osm-americana/openstreetmap-americana/issues/216
    tags: [surface, tracktype, smoothness, sac_scale, mtb:scale]
    note: Overview issue explicitly listing tracktype, smoothness, sac_scale, and mtb:scale as the key difficulty tags to address for track/path rendering. The most relevant upstream thread for all tracked tag gaps in Americana.
    checked_on: 2026-06-08
    last_reply_date: 2025-01-05
profile_id: default
