            effect_value: "10"
            direction: both
          - tag_value: very_horrible
            effect_kind: speed_cap_kmh
            effect_value: "5"
            direction: both
          - tag_value: impassable
            effect_kind: speed_cap_kmh
            effect_value: "0"
            direction: both
        special_handling:
          - impassable effectively blocks use through zero speed cap.
        unknown_value_behavior: ignore
        missing_tag_behavior: none
        hard_exclusions: [impassable]
        value_coverage: full
