engine_id: josm
capability_id: preset_ui
engine_meta:
  website: https://josm.openstreetmap.de
  repository: https://github.com/JOSM/josm
  issues: https://josm.openstreetmap.de/trac
spec_status: draft_partial
coverage_scope: General-purpose desktop editor. Preset field support applies globally; combo fields appear in any highway, path, or track preset dialog.
notes:
  - Any tag can be entered as free text in the tag panel regardless of preset support.
  - The default presets ship with the editor. Community presets (installable via Preferences > Map Settings > Tagging Presets) may extend or override value lists.
  - The JOSM validator provides independent value-level checking separate from preset dropdowns. It can flag unknown or deprecated values even when a preset field exists.
  - All supported combo values can also be typed manually; the field is editable, not locked.
  - JOSM issues are tracked at https://josm.openstreetmap.de/trac (Trac), not GitHub. Search for "surface", "sac_scale", or "mtb:scale" there for known preset gaps. related_issues is omitted for this entry because the tracker uses a non-GitHub URL scheme.
profile_id: general
mode: general
