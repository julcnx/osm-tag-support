          - tag_value: earth
            effect_kind: multiply_factor
            effect_value: "0.75"
          - tag_value: ground
            effect_kind: multiply_factor
            effect_value: "0.75"
          - tag_value: grass
            effect_kind: multiply_factor
            effect_value: "0.65"
          - tag_value: dirt
            effect_kind: multiply_factor
            effect_value: "0.50"
          - tag_value: mud
            effect_kind: multiply_factor
            effect_value: "0.5"
          - tag_value: sand
            effect_kind: multiply_factor
            effect_value: "0.45"
        special_handling:
          - Values represent the main bicycle routing branch; avoid_unpaved and prefer_unpaved branches alter these significantly.
          - Some profiles use merged integrity variable derived from surface/smoothness/tracktype.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: profile_default
        hard_exclusions: []
        value_coverage: partial
      - tag_key: smoothness
        support_level: profile_dependent
        effect_types: [priority_factor, access_block]
        precedence_order:
          [profile_branch, highway, surface, smoothness, tracktype]
        value_rules:
          - tag_value: bad
            effect_kind: multiply_factor
            effect_value: "0.8"
          - tag_value: very_bad
            effect_kind: multiply_factor
            effect_value: "0.5"
          - tag_value: impassable
            effect_kind: multiply_factor
            effect_value: "0.05"
        special_handling:
          - Can be merged into osmand_highway_integrity_brouting in some logic paths.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: profile_default
        hard_exclusions: [impassable]
      - tag_key: tracktype
        support_level: profile_dependent
        effect_types: [priority_factor, route_preference]
        precedence_order:
          [profile_branch, highway, surface, smoothness, tracktype]
        value_rules:
          - tag_value: grade1
            effect_kind: multiply_factor
            effect_value: "1.3"
          - tag_value: grade4
            effect_kind: multiply_factor
            effect_value: "0.7"
          - tag_value: grade5
            effect_kind: multiply_factor
            effect_value: "0.5"
        special_handling:
          - Strongly profile- and parameter-dependent.
        unknown_value_behavior: fallback_default
        missing_tag_behavior: profile_default
        hard_exclusions: []
