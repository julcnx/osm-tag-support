            effect_value: "1.1"
          - tag_value: fine_gravel
            effect_kind: multiply_factor
            effect_value: "1.1"
          - tag_value: wood
            effect_kind: multiply_factor
            effect_value: "1.0"
          - tag_value: sett
            effect_kind: multiply_factor
            effect_value: "0.7"
