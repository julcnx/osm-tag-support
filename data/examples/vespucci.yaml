engine_meta:
  website: https://vespucci.io
  repository: https://github.com/MarcusWolschon/osmeditor4android
  issues: https://github.com/MarcusWolschon/osmeditor4android/issues
spec_status: draft_partial
coverage_scope: Android OSM editor. Preset support mirrors JOSM-compatible preset format; field coverage is equivalent to JOSM for the tags tracked here.
notes:
  - Vespucci loads presets from XML files compatible with the JOSM preset format. The bundled presets ship with the app; additional presets can be added from the Preset Manager.
  - Preset fields render as spinner dropdowns or auto-complete text fields depending on the field type declaration.
  - Tags without a preset field can be added or edited via the "Properties" (tag list) view, which accepts any key/value pair.
  - Vespucci also includes a built-in validator similar to JOSM's, which flags unknown or deprecated values. Validation rules are configured separately from presets.
  - The default bundled preset is maintained at https://github.com/simonpoole/preset-utils and is updated independently of the app release cycle.
